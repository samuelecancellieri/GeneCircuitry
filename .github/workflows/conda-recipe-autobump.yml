name: Bump Conda Recipe & Autobump Bioconda

# Triggered when a GitHub release is published, or manually via workflow_dispatch.
#
# 1. Updates conda-recipe/meta.yaml in this repository with the new version
#    and the sha256 checksum of the PyPI source tarball, then commits the change
#    back to the default branch.
# 2. Automatically forks bioconda/bioconda-recipes, updates recipes/genecircuitry/meta.yaml,
#    and opens a Pull Request against bioconda/bioconda-recipes to publish the new version.
#
# Note on Bioconda PR authentication:
#   To automatically submit PRs to bioconda/bioconda-recipes, configure a GitHub
#   Personal Access Token (PAT with 'public_repo' or 'repo' scope) as the
#   repository secret `BIOCONDA_TOKEN` (or `GH_TOKEN`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Target version to bump (e.g. 0.2.3, leave blank to auto-detect from tag/repo)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Simulate run without committing or opening PR"
        required: false
        default: false
        type: boolean
      local_only:
        description: "Only update local conda-recipe/meta.yaml (skip Bioconda PR)"
        required: false
        default: false
        type: boolean
      bioconda_repo:
        description: "Upstream Bioconda repository"
        required: false
        default: "bioconda/bioconda-recipes"
        type: string

permissions:
  contents: write

jobs:
  bump-local-recipe:
    name: Update local conda-recipe/meta.yaml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.sha256.outputs.sha256 }}

    steps:
      # ── 1. Checkout default branch ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Extract version ────────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            VERSION="${TAG#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version to bump."
            exit 1
          fi

          # Strip any leading 'v'
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $VERSION"

      # ── 4. Wait for the source tarball to appear on PyPI ──────────────────
      #    publish.yml runs in parallel; wait up to 6 minutes (12 × 30 s).
      - name: Wait for PyPI availability & fetch checksum
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -c "
          from scripts.autobump_bioconda import get_pypi_release_info
          url, sha = get_pypi_release_info('genecircuitry', '$VERSION')
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'sha256={sha}\n')
          print(f'Retrieved SHA256: {sha}')
          "

      # ── 5. Rewrite version and sha256 in local conda-recipe/meta.yaml ─────
      - name: Update local meta.yaml
        id: update_recipe
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          python3 scripts/autobump_bioconda.py \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --recipe-path "conda-recipe/meta.yaml" \
            --local-only \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )

      # ── 6. Commit and push back to repository ─────────────────────────────
      - name: Commit updated recipe
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conda-recipe/meta.yaml
          if git diff --cached --quiet; then
            echo "No changes to local conda-recipe/meta.yaml – skipping commit."
          else
            git commit -m "chore: bump conda recipe to v${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi

  bump-bioconda-recipes:
    name: Autobump bioconda/bioconda-recipes PR
    needs: [bump-local-recipe]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.local_only != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Submit Pull Request to Bioconda
        id: bioconda_pr
        run: |
          VERSION="${{ needs.bump-local-recipe.outputs.version }}"
          SHA256="${{ needs.bump-local-recipe.outputs.sha256 }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          BIOCONDA_REPO="${{ github.event.inputs.bioconda_repo || 'bioconda/bioconda-recipes' }}"

          python3 scripts/autobump_bioconda.py \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --recipe-path "conda-recipe/meta.yaml" \
            --bioconda-repo "$BIOCONDA_REPO" \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )
        env:
          BIOCONDA_TOKEN: ${{ secrets.BIOCONDA_TOKEN || secrets.GH_TOKEN }}

      - name: Job Summary
        run: |
          VERSION="${{ needs.bump-local-recipe.outputs.version }}"
          SHA256="${{ needs.bump-local-recipe.outputs.sha256 }}"
          echo "## Bioconda Recipe Autobump Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA256:** \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PyPI Source:** https://pypi.org/project/genecircuitry/$VERSION/" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Bioconda Repo:** \`${{ github.event.inputs.bioconda_repo || 'bioconda/bioconda-recipes' }}\`" >> "$GITHUB_STEP_SUMMARY"
